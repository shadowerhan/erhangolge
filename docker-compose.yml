services:
  db:
    image: postgres:16-alpine
    environment: {POSTGRES_USER: zerber, POSTGRES_PASSWORD: zerber, POSTGRES_DB: zerberhobi}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck: {test: [CMD-SHELL, "pg_isready -U zerber"], interval: 5s, timeout: 5s, retries: 10}
  redis:
    image: redis:7-alpine
  app:
    build: .
    environment: {DATABASE_URL: "postgresql://zerber:zerber@db:5432/zerberhobi?schema=public", JWT_SECRET: "${JWT_SECRET:-change-in-production}", NEXT_PUBLIC_APP_URL: "http://localhost:8080"}
    depends_on: {db: {condition: service_healthy}}
    ports: ["3000:3000"]
  nginx:
    image: nginx:1.27-alpine
    volumes: ["./nginx/nginx.conf:/etc/nginx/nginx.conf:ro"]
    depends_on: [app]
    ports: ["8080:80"]
volumes: {postgres_data: {}}
