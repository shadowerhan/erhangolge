events { worker_connections 1024; }
http {
  upstream zerber_app { server app:3000; }
  server {
    listen 80; server_name _;
    location /_next/static/ { proxy_pass http://zerber_app; expires 365d; add_header Cache-Control "public, immutable"; }
    location / { proxy_pass http://zerber_app; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-Proto $scheme; }
  }
  # Production TLS: add a 443 server with ssl_certificate, then return 301 https://$host$request_uri here.
}
